name: Frontend CI — Self-hosted Fallback

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to validate
        required: true
        default: feature/68-platform-api
      run_e2e:
        description: Install Chromium and run Playwright/axe checks
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: frontend-self-hosted-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, ptc-dashboard]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          clean: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Install dependencies
        shell: bash
        run: |
          if test -f pnpm-lock.yaml; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi
          test -s pnpm-lock.yaml
      - name: Upload generated or validated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-frontend-self-hosted-${{ github.run_id }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 14
      - run: pnpm --filter @ptc-bale/dashboard-web lint
      - run: pnpm --filter @ptc-bale/dashboard-web typecheck
      - run: pnpm --filter @ptc-bale/dashboard-web test
      - name: Build production mock portal
        run: pnpm --filter @ptc-bale/dashboard-web build
        env:
          VITE_DATA_MODE: mock
          VITE_ENVIRONMENT_NAME: Isolated Development Demo
          VITE_BUILD_VERSION: self-hosted-${{ github.run_id }}
          VITE_ALLOW_DEMO_CREDENTIALS: 'true'
          VITE_MOCK_LATENCY_MS: '120'
      - name: Scan production bundle
        shell: bash
        run: |
          test -d apps/dashboard-web/dist
          ! find apps/dashboard-web/dist -name '*.map' | grep -q .
          ! grep -R -E '(BEGIN (RSA|OPENSSH) PRIVATE KEY|postgresql://[^ ]+:[^ ]+@|mongodb\+srv://|rtsp://[^ ]+:[^ ]+@)' apps/dashboard-web/dist
      - name: Build deployment container
        run: |
          docker build \
            --file apps/dashboard-web/Dockerfile \
            --build-arg VITE_DATA_MODE=mock \
            --build-arg 'VITE_ENVIRONMENT_NAME=Isolated Development Demo' \
            --build-arg VITE_BUILD_VERSION=self-hosted-${{ github.run_id }} \
            --build-arg VITE_ALLOW_DEMO_CREDENTIALS=true \
            --tag ptc-bale-dashboard:self-hosted-${{ github.run_id }} \
            .
      - name: Smoke-test deployment container
        shell: bash
        run: |
          docker rm --force ptc-dashboard-validation >/dev/null 2>&1 || true
          docker run --detach --rm --name ptc-dashboard-validation -p 18080:8080 ptc-bale-dashboard:self-hosted-${{ github.run_id }}
          trap 'docker stop ptc-dashboard-validation >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:18080/healthz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/events | grep -qi '<div id="root"></div>'
          curl --fail --silent --head http://127.0.0.1:18080/ | grep -qi 'content-security-policy'
      - name: Install Playwright browser
        if: ${{ inputs.run_e2e }}
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/dashboard-web
      - name: Run Playwright and accessibility checks
        if: ${{ inputs.run_e2e }}
        run: pnpm test:e2e
        working-directory: apps/dashboard-web
        env:
          VITE_DATA_MODE: mock
          VITE_ALLOW_DEMO_CREDENTIALS: 'true'
          VITE_MOCK_LATENCY_MS: '40'
      - name: Upload static portal
        uses: actions/upload-artifact@v4
        with:
          name: ptc-dashboard-self-hosted-${{ github.run_id }}
          path: apps/dashboard-web/dist
          if-no-files-found: error
          retention-days: 14
      - if: always() && inputs.run_e2e
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-playwright-self-hosted-${{ github.run_id }}
          path: apps/dashboard-web/playwright-report
          retention-days: 14