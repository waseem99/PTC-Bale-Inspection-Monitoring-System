name: Local Runtime CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/**'
      - 'infrastructure/local/**'
      - 'scripts/local/**'
      - 'tools/edge-simulator/**'
      - 'packages/contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/local-runtime-ci.yml'

permissions:
  contents: read

concurrency:
  group: local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-go-live:
    name: Build and certify one-machine runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASE_URL: http://127.0.0.1:18080
      LOCAL_ENV_FILE: ${{ runner.temp }}/ptc-bale/runtime.env
      LOCAL_DATA_ROOT: ${{ runner.temp }}/ptc-bale/data
      COMPOSE_FILE: infrastructure/local/docker-compose.local.yml
      LOCAL_PROJECT_DIR: infrastructure/local

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate operator scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/local/bootstrap.sh scripts/local/ptc-local.sh
          python -m py_compile tools/edge-simulator/ptc_edge_spool.py tools/edge-simulator/local_service.py
          (
            cd tools/edge-simulator
            python -m unittest -v
          )
          pwsh -NoLogo -NoProfile -Command '
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("scripts/local/ptc-local.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            [System.Management.Automation.Language.Parser]::ParseFile("scripts/local/bootstrap.ps1", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          '

      - name: Generate isolated local runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$(dirname "$LOCAL_ENV_FILE")" \
            "$LOCAL_DATA_ROOT/postgres" \
            "$LOCAL_DATA_ROOT/evidence" \
            "$LOCAL_DATA_ROOT/spool" \
            "$LOCAL_DATA_ROOT/backups" \
            "$LOCAL_DATA_ROOT/logs/caddy"
          DB_PASSWORD="$(openssl rand -hex 24)"
          VIEWER_PASSWORD="$(openssl rand -hex 16)"
          SUPERVISOR_PASSWORD="$(openssl rand -hex 16)"
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          INGESTION_TOKEN="$(openssl rand -hex 32)"
          for secret in "$DB_PASSWORD" "$VIEWER_PASSWORD" "$SUPERVISOR_PASSWORD" "$ADMIN_PASSWORD" "$INGESTION_TOKEN"; do
            echo "::add-mask::$secret"
          done
          cat > "$LOCAL_ENV_FILE" <<EOF
          PTC_DATA_ROOT=$LOCAL_DATA_ROOT
          LOCAL_UID=$(id -u)
          LOCAL_GID=$(id -g)
          LOCAL_BIND_ADDRESS=127.0.0.1
          LOCAL_HTTP_PORT=18080
          ALLOWED_ORIGINS=http://localhost:18080,http://127.0.0.1:18080
          PTC_RUNTIME_MODE=simulator
          POSTGRES_DB=ptc_bale
          POSTGRES_USER=ptc_app
          POSTGRES_PASSWORD=$DB_PASSWORD
          DATABASE_URL=postgresql://ptc_app:$DB_PASSWORD@postgres:5432/ptc_bale?schema=public
          SESSION_COOKIE_NAME=ptc_session
          SESSION_TTL_HOURS=8
          SEED_VIEWER_PASSWORD=$VIEWER_PASSWORD
          SEED_SUPERVISOR_PASSWORD=$SUPERVISOR_PASSWORD
          SEED_ADMIN_PASSWORD=$ADMIN_PASSWORD
          INGESTION_SERVICE_TOKEN=$INGESTION_TOKEN
          MAX_EVIDENCE_BYTES=26214400
          EDGE_FLUSH_INTERVAL_SECONDS=2
          EDGE_HTTP_TIMEOUT_SECONDS=5
          SIMULATOR_SEQUENCE_BASE=1000
          SIMULATOR_GENERATE_EVERY_SECONDS=3600
          IMAGE_TAG=local-ci-${GITHUB_SHA::12}
          BUILD_VERSION=local-ci-${GITHUB_SHA::12}
          BUILD_COMMIT=$GITHUB_SHA
          SCHEMA_VERSION=20260731-camera-contract-v1
          EOF
          chmod 600 "$LOCAL_ENV_FILE"
          {
            echo "VIEWER_PASSWORD=$VIEWER_PASSWORD"
            echo "SUPERVISOR_PASSWORD=$SUPERVISOR_PASSWORD"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "INGESTION_TOKEN=$INGESTION_TOKEN"
          } >> "$GITHUB_ENV"

      - name: Validate Compose and security boundaries
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" "$@"; }
          compose config --quiet
          CONFIG="$(compose config)"
          ! grep -Eq 'published: "?5432"?|target: 5432.*published' <<<"$CONFIG"
          ! grep -Eq 'published: "?4000"?|target: 4000.*published' <<<"$CONFIG"
          grep -q 'host_ip: 127.0.0.1' <<<"$CONFIG"
          grep -q 'internal: true' <<<"$CONFIG"
          test "$(docker compose version --short | cut -d. -f1)" -ge 2

      - name: Build and start complete local stack
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" "$@"; }
          compose build
          compose up -d --remove-orphans
          for attempt in {1..120}; do
            if curl --fail --silent "$BASE_URL/healthz" >/dev/null 2>&1; then
              compose ps
              exit 0
            fi
            sleep 2
          done
          compose ps
          compose logs --tail=300
          exit 1

      - name: Validate authentication, reports, camera contract, evidence and realtime
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" "$@"; }
          curl --fail --silent --show-error \
            --cookie-jar /tmp/supervisor.cookies \
            --header "Origin: $BASE_URL" \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"supervisor\",\"password\":\"$SUPERVISOR_PASSWORD\"}" \
            "$BASE_URL/api/auth/login" >/tmp/supervisor-login.json
          jq -e '.user.role == "supervisor"' /tmp/supervisor-login.json >/dev/null
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/camera-config" >/tmp/camera-config.json
          jq -e '.schemaVersion == "camera-contract-v1" and (.cameras | length) == 4' /tmp/camera-config.json >/dev/null
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/reports/summary" >/tmp/report-summary.json
          jq -e '.generatedAt and (.total >= 257)' /tmp/report-summary.json >/dev/null
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/reports/pdf" >/tmp/report.pdf
          test "$(head -c 4 /tmp/report.pdf)" = '%PDF'

          for attempt in {1..60}; do
            EVENT_ID=$(compose exec -T postgres psql -U ptc_app -d ptc_bale -At \
              -c "SELECT id FROM inspection_events WHERE source='simulator' ORDER BY \"createdAt\" DESC LIMIT 1;" | tr -d '\r')
            if [[ -n "$EVENT_ID" ]]; then
              EVIDENCE_STATE=$(compose exec -T postgres psql -U ptc_app -d ptc_bale -At \
                -c "SELECT state::text FROM evidence_metadata WHERE \"eventId\"='$EVENT_ID';" | tr -d '[:space:]')
              [[ "$EVIDENCE_STATE" == 'available' ]] && break
            fi
            sleep 2
          done
          test -n "${EVENT_ID:-}"
          test "${EVIDENCE_STATE:-}" = 'available'
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/events/$EVENT_ID" >/tmp/simulator-event.json
          EVIDENCE_URL=$(jq -er '.evidence.contentUrl' /tmp/simulator-event.json)
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            --range 0-15 "$BASE_URL$EVIDENCE_URL" >/tmp/evidence-range.bin
          test "$(wc -c </tmp/evidence-range.bin)" -eq 16

          set +e
          timeout 5 curl --no-buffer --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/realtime" >/tmp/realtime.txt
          REALTIME_STATUS=$?
          set -e
          test "$REALTIME_STATUS" -eq 0 -o "$REALTIME_STATUS" -eq 124
          grep -Eq 'retry:|event:' /tmp/realtime.txt

      - name: Validate durable queue through API outage and exact replay
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" "$@"; }
          compose stop api
          compose exec -T edge-spool python /app/ptc_edge_spool.py \
            --database /var/lib/ptc-bale/spool/spool.sqlite3 \
            enqueue-event --camera CAM-04 --scenario incomplete --sequence 999999 >/tmp/outage-event-id.txt
          compose exec -T edge-spool python /app/ptc_edge_spool.py \
            --database /var/lib/ptc-bale/spool/spool.sqlite3 \
            enqueue-event --camera CAM-04 --scenario incomplete --sequence 999999 >/tmp/replay-event-id.txt
          diff -u /tmp/outage-event-id.txt /tmp/replay-event-id.txt
          sleep 4
          compose exec -T edge-spool python /app/ptc_edge_spool.py \
            --database /var/lib/ptc-bale/spool/spool.sqlite3 status >/tmp/spool-during-outage.json
          jq -e '.pending >= 1' /tmp/spool-during-outage.json >/dev/null
          compose start api
          for attempt in {1..60}; do
            if compose exec -T api wget -qO- http://127.0.0.1:4000/readyz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for attempt in {1..60}; do
            COUNT=$(compose exec -T postgres psql -U ptc_app -d ptc_bale -At \
              -c "SELECT count(*) FROM inspection_events WHERE id='SIM-CAM-04-incomplete-999999';" | tr -d '[:space:]')
            [[ "$COUNT" == '1' ]] && break
            sleep 2
          done
          test "${COUNT:-0}" = '1'

      - name: Validate local backup and checksums
        shell: bash
        env:
          PTC_RUNTIME_ENV: ${{ runner.temp }}/ptc-bale/runtime.env
          PTC_DATA_ROOT: ${{ runner.temp }}/ptc-bale/data
        run: |
          set -euo pipefail
          bash scripts/local/ptc-local.sh backup
          test -n "$(find "$LOCAL_DATA_ROOT/backups" -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "$(find "$LOCAL_DATA_ROOT/backups" -maxdepth 1 -name '*evidence*.tar.gz' -print -quit)"
          CHECKSUM_FILE=$(find "$LOCAL_DATA_ROOT/backups" -maxdepth 1 -name '*.sha256' -print -quit)
          test -n "$CHECKSUM_FILE"
          (cd "$LOCAL_DATA_ROOT/backups" && sha256sum --check "$(basename "$CHECKSUM_FILE")")

      - name: Validate hardware-ready mode disables generation
        shell: bash
        env:
          PTC_RUNTIME_ENV: ${{ runner.temp }}/ptc-bale/runtime.env
          PTC_DATA_ROOT: ${{ runner.temp }}/ptc-bale/data
        run: |
          set -euo pipefail
          compose() { docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" "$@"; }
          BEFORE=$(compose exec -T postgres psql -U ptc_app -d ptc_bale -At \
            -c "SELECT count(*) FROM inspection_events WHERE source='simulator';" | tr -d '[:space:]')
          bash scripts/local/ptc-local.sh mode hardware-ready
          grep -q '^PTC_RUNTIME_MODE=hardware-ready$' "$LOCAL_ENV_FILE"
          sleep 8
          AFTER=$(compose exec -T postgres psql -U ptc_app -d ptc_bale -At \
            -c "SELECT count(*) FROM inspection_events WHERE source='simulator';" | tr -d '[:space:]')
          test "$AFTER" = "$BEFORE"
          MODE=$(compose exec -T edge-spool sh -c 'printf %s "$PTC_RUNTIME_MODE"')
          test "$MODE" = 'hardware-ready'

      - name: Validate persistence across full stop and start
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" "$@"; }
          BEFORE=$(compose exec -T postgres psql -U ptc_app -d ptc_bale -At -c 'SELECT count(*) FROM inspection_events;' | tr -d '[:space:]')
          compose stop
          compose up -d
          for attempt in {1..90}; do
            if curl --fail --silent "$BASE_URL/healthz" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          AFTER=$(compose exec -T postgres psql -U ptc_app -d ptc_bale -At -c 'SELECT count(*) FROM inspection_events;' | tr -d '[:space:]')
          test "$AFTER" = "$BEFORE"

      - name: Record sanitized local certification evidence
        if: always()
        shell: bash
        run: |
          set +e
          compose() { docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" "$@"; }
          {
            echo "commit=$GITHUB_SHA"
            echo "docker=$(docker version --format '{{.Server.Version}}' 2>/dev/null)"
            echo "compose=$(docker compose version --short 2>/dev/null)"
            echo "runtime_url=$BASE_URL"
            echo "configuration=workstation-only"
            compose ps --format json 2>/dev/null | jq -c 'del(.ID, .Image)' || true
            echo "secrets_redacted=true"
          } > local-runtime-certification.log

      - name: Upload sanitized local certification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-certification-${{ github.sha }}
          path: local-runtime-certification.log
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          docker compose --env-file "$LOCAL_ENV_FILE" --project-directory "$LOCAL_PROJECT_DIR" -f "$COMPOSE_FILE" down --remove-orphans >/dev/null 2>&1 || true
