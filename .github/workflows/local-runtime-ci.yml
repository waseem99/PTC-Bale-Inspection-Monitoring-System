name: Local Runtime CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/**'
      - 'infrastructure/local/**'
      - 'scripts/local/**'
      - 'tools/edge-simulator/**'
      - 'packages/contracts/**'
      - '.github/workflows/local-runtime-ci.yml'
  pull_request:
    paths:
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/**'
      - 'infrastructure/local/**'
      - 'scripts/local/**'
      - 'tools/edge-simulator/**'
      - 'packages/contracts/**'
      - '.github/workflows/local-runtime-ci.yml'

permissions:
  contents: read

concurrency:
  group: local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-go-live:
    name: Build and certify one-machine runtime
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require local certification harness
        shell: bash
        run: test -s scripts/local/ci.sh

      - name: Run local go-live certification
        shell: bash
        run: bash scripts/local/ci.sh

      - name: Upload sanitized local certification record
        if: always() && hashFiles('local-runtime-certification.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: local-runtime-certification-${{ github.sha }}
          path: local-runtime-certification.log
          if-no-files-found: error
          retention-days: 30
