name: Deploy PTC Bale (staging)

on:
  push:
    branches: [main]       # deploys whenever main updates
  workflow_dispatch: {}    # allows manual "Run workflow" from the Actions tab

concurrency:
  group: ptc-bale-staging-deploy
  cancel-in-progress: false   # don't cancel a deploy mid-flight if another push comes in

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ~/PTC-Bale-Inspection-Monitoring-System
            git fetch origin
            git checkout main
            git reset --hard origin/main

            cd infrastructure/local
            docker compose --env-file .env -f docker-compose.local.yml up -d --build

            echo "Waiting for services to settle..."
            sleep 15
            docker compose --env-file .env -f docker-compose.local.yml ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            curl -sf http://127.0.0.1:9081/healthz || (echo "Health check failed" && exit 1)
