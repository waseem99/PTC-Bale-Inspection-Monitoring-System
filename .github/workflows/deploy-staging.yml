name: Deploy PTC Bale (staging)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ptc-bale-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ~/PTC-Bale-Inspection-Monitoring-System
            git fetch origin
            git checkout main
            git reset --hard origin/main

            cd infrastructure/local

            # Runtime overrides take precedence over .env without mutating protected server files.
            export SESSION_TTL_HOURS=720
            export SESSION_ABSOLUTE_TTL_HOURS=720
            export BUILD_COMMIT="$(git rev-parse HEAD)"
            export BUILD_VERSION="staging-${BUILD_COMMIT:0:12}"
            export IMAGE_TAG="$BUILD_VERSION"

            MEDIA_ROOT="$(awk -F= '/^PTC_DATA_ROOT=/{sub(/^PTC_DATA_ROOT=/, ""); print; exit}' .env)"
            if [ -z "$MEDIA_ROOT" ]; then
              echo "PTC_DATA_ROOT is missing from infrastructure/local/.env"
              exit 1
            fi
            mkdir -p "$MEDIA_ROOT/media"

            # Camera previews default to shared Google Drive links in the dashboard build.
            # Optional local MP4s or VITE_CAMERA_* overrides still work when present.
            CONFIGURED_PREVIEWS="$(awk -F= '/^VITE_CAMERA_0[1-4]_PREVIEW_URL=/{value=$0; sub(/^[^=]*=/, "", value); if (length(value) > 0) count++} END {print count+0}' .env)"
            LOCAL_PREVIEWS="$(find "$MEDIA_ROOT/media" -maxdepth 1 -type f \( -name 'camera-01.mp4' -o -name 'camera-02.mp4' -o -name 'camera-03.mp4' -o -name 'camera-04.mp4' \) | wc -l | tr -d ' ')"

            echo "Configured external preview sources: $CONFIGURED_PREVIEWS"
            echo "Local camera preview files: $LOCAL_PREVIEWS"
            echo "Dashboard Drive defaults are enabled in-app; local/env media is optional."

            docker compose \
              --env-file .env \
              -f docker-compose.local.yml \
              -f docker-compose.video-previews.yml \
              up -d --build

            echo "Waiting for services to settle..."
            sleep 15
            docker compose \
              --env-file .env \
              -f docker-compose.local.yml \
              -f docker-compose.video-previews.yml \
              ps

      - name: Verify deployment
        id: verify
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -e
            curl -sf http://127.0.0.1:9081/healthz >/dev/null || (echo "Health check failed" && exit 1)

            cd ~/PTC-Bale-Inspection-Monitoring-System/infrastructure/local

            export SESSION_TTL_HOURS=720
            export SESSION_ABSOLUTE_TTL_HOURS=720
            export BUILD_COMMIT="$(git -C ../.. rev-parse HEAD)"
            export BUILD_VERSION="staging-${BUILD_COMMIT:0:12}"
            export IMAGE_TAG="$BUILD_VERSION"

            COMPOSE=(docker compose --env-file .env -f docker-compose.local.yml -f docker-compose.video-previews.yml)
            SESSION_TTL="$("${COMPOSE[@]}" exec -T api printenv SESSION_TTL_HOURS | tr -d '\r')"
            SESSION_ABSOLUTE_TTL="$("${COMPOSE[@]}" exec -T api printenv SESSION_ABSOLUTE_TTL_HOURS | tr -d '\r')"
            [ "$SESSION_TTL" = "720" ] || { echo "Unexpected SESSION_TTL_HOURS=$SESSION_TTL"; exit 1; }
            [ "$SESSION_ABSOLUTE_TTL" = "720" ] || { echo "Unexpected SESSION_ABSOLUTE_TTL_HOURS=$SESSION_ABSOLUTE_TTL"; exit 1; }

            # Exercise the deployed API session lifecycle for all dashboard roles.
            "${COMPOSE[@]}" exec -T api node <<'NODE'
            const base = 'http://127.0.0.1:4000';
            const roles = [
              ['viewer', 'SEED_VIEWER_PASSWORD'],
              ['supervisor', 'SEED_SUPERVISOR_PASSWORD'],
              ['admin', 'SEED_ADMIN_PASSWORD'],
            ];

            function requireCookie(response) {
              const raw = response.headers.get('set-cookie');
              if (!raw) throw new Error('Missing session Set-Cookie header');
              if (!raw.includes('HttpOnly')) throw new Error('Session cookie is not HttpOnly');
              if (!raw.includes('SameSite=Strict')) throw new Error('Session cookie is not SameSite=Strict');
              return raw.split(';', 1)[0];
            }

            for (const [username, passwordKey] of roles) {
              const password = process.env[passwordKey];
              if (!password) throw new Error(`Missing ${passwordKey}`);

              const login = await fetch(`${base}/api/auth/login`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ username, password }),
              });
              if (login.status !== 200) throw new Error(`${username} login failed: ${login.status}`);
              let cookie = requireCookie(login);
              const first = await login.json();
              const firstExpiry = Date.parse(first.expiresAt);
              const remainingHours = (firstExpiry - Date.now()) / 3_600_000;
              if (remainingHours < 719 || remainingHours > 721) {
                throw new Error(`${username} session is not approximately 30 days: ${remainingHours.toFixed(2)}h`);
              }

              await new Promise((resolve) => setTimeout(resolve, 1200));

              const me = await fetch(`${base}/api/auth/me`, { headers: { cookie } });
              if (me.status !== 200) throw new Error(`${username} session refresh failed: ${me.status}`);
              cookie = requireCookie(me);
              const second = await me.json();
              const secondExpiry = Date.parse(second.expiresAt);
              if (Math.abs(secondExpiry - firstExpiry) > 5000) {
                throw new Error(`${username} 30-day absolute expiry changed unexpectedly`);
              }
              if (me.headers.get('x-session-expires-at') !== second.expiresAt) {
                throw new Error(`${username} expiry header/body mismatch`);
              }

              const logout = await fetch(`${base}/api/auth/logout`, {
                method: 'POST',
                headers: { cookie },
              });
              if (logout.status !== 204) throw new Error(`${username} logout failed: ${logout.status}`);

              const afterLogout = await fetch(`${base}/api/auth/me`, { headers: { cookie } });
              if (afterLogout.status !== 401) {
                throw new Error(`${username} revoked session remained valid: ${afterLogout.status}`);
              }
            }

            console.log('Session runtime smoke passed for viewer, supervisor and admin.');
            NODE
            MEDIA_ROOT="$(awk -F= '/^PTC_DATA_ROOT=/{sub(/^PTC_DATA_ROOT=/, ""); print; exit}' .env)"
            LOCAL_PREVIEWS="$(find "$MEDIA_ROOT/media" -maxdepth 1 -type f \( -name 'camera-01.mp4' -o -name 'camera-02.mp4' -o -name 'camera-03.mp4' -o -name 'camera-04.mp4' \) | wc -l | tr -d ' ')"

            if [ "$LOCAL_PREVIEWS" -gt 0 ]; then
              VERIFIED=0
              for camera in 01 02 03 04; do
                if [ -f "$MEDIA_ROOT/media/camera-${camera}.mp4" ]; then
                  curl -sf --range 0-1023 "http://127.0.0.1:9081/media/camera-${camera}.mp4" >/dev/null
                  VERIFIED=$((VERIFIED + 1))
                fi
              done
              echo "Verified local dashboard video endpoints: $VERIFIED"
              [ "$VERIFIED" -gt 0 ]
            else
              echo "Dashboard uses built-in Google Drive camera previews; local media endpoint verification is not applicable."
            fi

            # Prove schema state on the exact deployed stack.
            "${COMPOSE[@]}" run --rm migrate pnpm --filter @ptc-bale/platform-api exec prisma migrate status

            # Reuse the repository's existing end-to-end acceptance runner against staging.
            export PTC_BASE_URL="http://127.0.0.1:9081"
            export PTC_ORIGIN="$("${COMPOSE[@]}" exec -T api printenv ALLOWED_ORIGINS | tr -d '\r' | cut -d',' -f1)"
            [ -n "$PTC_ORIGIN" ] || { echo "No approved origin available for acceptance runner"; exit 1; }
            export SEED_VIEWER_PASSWORD="$("${COMPOSE[@]}" exec -T api printenv SEED_VIEWER_PASSWORD | tr -d '\r')"
            export SEED_SUPERVISOR_PASSWORD="$("${COMPOSE[@]}" exec -T api printenv SEED_SUPERVISOR_PASSWORD | tr -d '\r')"
            export SEED_ADMIN_PASSWORD="$("${COMPOSE[@]}" exec -T api printenv SEED_ADMIN_PASSWORD | tr -d '\r')"
            export INGESTION_SERVICE_TOKEN="$("${COMPOSE[@]}" exec -T api printenv INGESTION_SERVICE_TOKEN | tr -d '\r')"

            ACCEPTANCE_DIR="$(mktemp -d)"
            trap 'rm -rf "$ACCEPTANCE_DIR"' EXIT
            cd ~/PTC-Bale-Inspection-Monitoring-System
            python3 tools/testing/ptc_acceptance.py deployment --output "$ACCEPTANCE_DIR/deployment-record.json"
            export PTC_ACCEPTANCE_RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
            python3 tools/testing/ptc_acceptance.py integrated --output "$ACCEPTANCE_DIR/integrated-record.json"
            export PTC_ACCEPTANCE_EVENT_ID="$(python3 - "$ACCEPTANCE_DIR/integrated-record.json" <<'PY'
            import json
            import sys
            with open(sys.argv[1], encoding='utf-8') as handle:
                print(json.load(handle)['ingestion'][0]['id'])
            PY
            )"
            [ -n "$PTC_ACCEPTANCE_EVENT_ID" ] || { echo "Acceptance event ID was not recorded"; exit 1; }

            # Restart PostgreSQL + API and prove a committed synthetic event survives.
            cd infrastructure/local
            "${COMPOSE[@]}" restart postgres api
            READY=0
            for _ in $(seq 1 60); do
              if "${COMPOSE[@]}" exec -T api wget -qO- http://127.0.0.1:4000/readyz >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 2
            done
            [ "$READY" = "1" ] || { echo "API did not recover after PostgreSQL/API restart"; exit 1; }

            "${COMPOSE[@]}" exec -T -e PTC_ACCEPTANCE_EVENT_ID="$PTC_ACCEPTANCE_EVENT_ID" api node <<'NODE'
            const base = 'http://127.0.0.1:4000';
            const password = process.env.SEED_VIEWER_PASSWORD;
            const eventId = process.env.PTC_ACCEPTANCE_EVENT_ID;
            if (!eventId) throw new Error('missing acceptance event ID');
            const login = await fetch(`${base}/api/auth/login`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ username: 'viewer', password }),
            });
            if (login.status !== 200) throw new Error(`viewer login after restart failed: ${login.status}`);
            const rawCookie = login.headers.get('set-cookie');
            if (!rawCookie) throw new Error('missing session cookie after restart');
            const cookie = rawCookie.split(';', 1)[0];
            const event = await fetch(`${base}/api/events/${encodeURIComponent(eventId)}`, { headers: { cookie } });
            if (event.status !== 200) throw new Error(`persisted event missing after restart: ${event.status}`);
            console.log('Restart persistence check passed.');
            NODE

            # Produce and verify a protected database + evidence backup without restoring over staging.
            MEDIA_ROOT="$(awk -F= '/^PTC_DATA_ROOT=/{sub(/^PTC_DATA_ROOT=/, ""); print; exit}' .env)"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
            DUMP="ptc-bale-${STAMP}.dump"
            EVIDENCE="ptc-bale-evidence-${STAMP}.tar.gz"
            MANIFEST="ptc-bale-${STAMP}.sha256"
            "${COMPOSE[@]}" --profile tools run --rm backup-tools pg_dump --format=custom --file="/backups/$DUMP"
            "${COMPOSE[@]}" --profile tools run --rm archive-tools sh -c "tar -C /evidence -czf /backups/$EVIDENCE ."
            (
              cd "$MEDIA_ROOT/backups"
              test -s "$DUMP"
              test -s "$EVIDENCE"
              sha256sum "$DUMP" "$EVIDENCE" > "$MANIFEST"
              sha256sum -c "$MANIFEST"
            )

            echo "Full staging acceptance passed for commit $BUILD_COMMIT."

      - name: Record sanitized deployment acceptance
        if: ${{ always() }}
        uses: actions/github-script@v7
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        with:
          script: |
            const outcome = process.env.VERIFY_OUTCOME || 'skipped';
            const passed = outcome === 'success';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              `## Automated staging deployment acceptance — ${passed ? 'PASSED' : 'FAILED'}`,
              '',
              `- Run: [${process.env.GITHUB_RUN_ID}](${runUrl})`,
              `- Commit: \`${context.sha}\``,
              '- Package: \`tools/testing/ptc_acceptance.py deployment\`',
              '- Target: active SSH staging (internal endpoint omitted)',
              `- Verification outcome: **${outcome}**`,
              `- Deployment package result: **${passed ? 'passed' : 'not accepted'}**`,
              '- Secrets recorded in this issue: **no**',
              passed
                ? '- Checks passed: proxy health, authenticated Viewer session, release identity, cameras, system health, reports summary, and diagnostics'
                : '- Acceptance is not complete; inspect the linked workflow run before closing #83.',
              passed
                ? '- The same gated verification step also completed migration status, integrated synthetic acceptance, restart persistence, and checksummed database/evidence backup verification.'
                : '',
              '',
              'Sanitized acceptance record only; no credentials, tokens, private URLs, raw evidence, or client data are included.'
            ].filter(Boolean).join('\\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 83,
              body,
            });

      - name: Enforce deployment acceptance result
        if: ${{ steps.verify.outcome != 'success' }}
        run: exit 1
