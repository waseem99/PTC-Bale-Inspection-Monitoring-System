name: Deploy AWS Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/aws-staging-deploy.yml'
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/**'
      - 'infrastructure/aws/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ptc-bale-aws-staging
  cancel-in-progress: false

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://ptc_test:ptc_test_password@127.0.0.1:5432/ptc_bale_test?schema=public
  COOKIE_SECURE: 'false'
  TRUST_PROXY: 'false'
  ALLOWED_ORIGINS: http://localhost:4173
  SEED_DEMO_PASSWORD: GitHub-Actions-Test-Password-2026!

jobs:
  validate-build-deploy:
    name: Validate, package and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: aws-staging
      url: https://ptc-aibale.codistan.org

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ptc_bale_test
          POSTGRES_USER: ptc_test
          POSTGRES_PASSWORD: ptc_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ptc_test -d ptc_bale_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check required deployment variables
        shell: bash
        env:
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN_VALUE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_ARTIFACT_BUCKET_VALUE: ${{ vars.AWS_ARTIFACT_BUCKET }}
          AWS_EC2_INSTANCE_ID_VALUE: ${{ vars.AWS_EC2_INSTANCE_ID }}
          AWS_RUNTIME_PARAMETER_NAME_VALUE: ${{ vars.AWS_RUNTIME_PARAMETER_NAME }}
          AWS_API_DOMAIN_VALUE: ${{ vars.AWS_API_DOMAIN }}
        run: |
          set -euo pipefail
          for name in \
            AWS_REGION_VALUE \
            AWS_DEPLOY_ROLE_ARN_VALUE \
            AWS_ARTIFACT_BUCKET_VALUE \
            AWS_EC2_INSTANCE_ID_VALUE \
            AWS_RUNTIME_PARAMETER_NAME_VALUE \
            AWS_API_DOMAIN_VALUE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Environment variable: ${name%_VALUE}" >&2
              exit 1
            fi
          done

          if [[ "$AWS_API_DOMAIN_VALUE" != "api.ptc-aibale.codistan.org" ]]; then
            echo "AWS_API_DOMAIN must be api.ptc-aibale.codistan.org for this staging environment." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy test migration
        run: pnpm --filter @ptc-bale/platform-api db:migrate:deploy

      - name: Validate backend
        run: pnpm --filter @ptc-bale/platform-api check

      - name: Validate frontend
        run: pnpm --filter @ptc-bale/dashboard-web check

      - name: Build AWS container images
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --file apps/platform-api/Dockerfile.aws \
            --target runtime \
            --tag "ptc-bale-api:${GITHUB_SHA}" .
          docker build --platform linux/amd64 \
            --file apps/platform-api/Dockerfile.aws \
            --target tools \
            --tag "ptc-bale-tools:${GITHUB_SHA}" .
          docker build --platform linux/amd64 \
            --file apps/dashboard-web/Dockerfile.aws \
            --build-arg VITE_BUILD_VERSION="${GITHUB_SHA}" \
            --target runtime \
            --tag "ptc-bale-dashboard:${GITHUB_SHA}" .

      - name: Create release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/scripts
          cp infrastructure/aws/docker-compose.staging.yml release/
          cp infrastructure/aws/Caddyfile release/
          cp infrastructure/aws/scripts/deploy-release.sh release/scripts/
          cp infrastructure/aws/scripts/backup-postgres.sh release/scripts/
          cp infrastructure/aws/scripts/restore-postgres.sh release/scripts/
          printf '%s\n' "${GITHUB_SHA}" > release/VERSION
          docker save \
            "ptc-bale-api:${GITHUB_SHA}" \
            "ptc-bale-tools:${GITHUB_SHA}" \
            "ptc-bale-dashboard:${GITHUB_SHA}" \
            | gzip -9 > release/images.tar.gz
          tar -C release -czf release.tar.gz .
          sha256sum release.tar.gz > release.tar.gz.sha256

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ptc-bale-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload immutable release bundle
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp \
            release.tar.gz \
            "s3://${{ vars.AWS_ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}/release.tar.gz" \
            --only-show-errors
          aws s3 cp \
            release.tar.gz.sha256 \
            "s3://${{ vars.AWS_ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}/release.tar.gz.sha256" \
            --only-show-errors

      - name: Deploy through AWS Systems Manager
        id: ssm
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="/opt/ptc-bale/releases/${GITHUB_SHA}"
          S3_PREFIX="s3://${{ vars.AWS_ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}"

          jq -n \
            --arg release_dir "$RELEASE_DIR" \
            --arg s3_prefix "$S3_PREFIX" \
            --arg sha "$GITHUB_SHA" \
            --arg bucket "${{ vars.AWS_ARTIFACT_BUCKET }}" \
            --arg region "${{ vars.AWS_REGION }}" \
            --arg parameter "${{ vars.AWS_RUNTIME_PARAMETER_NAME }}" \
            '{commands: [
              "set -euo pipefail",
              ("rm -rf " + $release_dir + " && mkdir -p " + $release_dir),
              ("aws s3 cp " + $s3_prefix + "/release.tar.gz /tmp/release.tar.gz --only-show-errors"),
              ("aws s3 cp " + $s3_prefix + "/release.tar.gz.sha256 /tmp/release.tar.gz.sha256 --only-show-errors"),
              "cd /tmp && sha256sum --check release.tar.gz.sha256",
              ("tar -xzf /tmp/release.tar.gz -C " + $release_dir),
              ("chmod +x " + $release_dir + "/scripts/*.sh"),
              ("bash " + $release_dir + "/scripts/deploy-release.sh " + $sha + " " + $bucket + " " + $region + " " + $parameter),
              "rm -f /tmp/release.tar.gz /tmp/release.tar.gz.sha256"
            ]}' > /tmp/ssm-parameters.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids '${{ vars.AWS_EC2_INSTANCE_ID }}' \
            --document-name AWS-RunShellScript \
            --comment "Deploy PTC Bale ${GITHUB_SHA}" \
            --timeout-seconds 1800 \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          STATUS="Pending"
          for attempt in {1..180}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id '${{ vars.AWS_EC2_INSTANCE_ID }}' \
              --query 'Status' \
              --output text 2>/dev/null || printf 'Pending')"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id '${{ vars.AWS_EC2_INSTANCE_ID }}' \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' || true
          [[ "$STATUS" == "Success" ]]

      - name: Verify public API readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 20 \
            --retry-delay 5 \
            --retry-all-errors \
            "https://${{ vars.AWS_API_DOMAIN }}/readyz"
