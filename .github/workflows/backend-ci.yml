name: Backend CI
on:
  pull_request:
    paths:
      - 'apps/platform-api/**'
      - 'apps/dashboard-web/**'
      - 'packages/contracts/**'
      - 'infrastructure/local/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main, project-foundation]
    paths:
      - 'apps/platform-api/**'
      - 'apps/dashboard-web/**'
      - 'packages/contracts/**'
      - 'infrastructure/local/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/backend-ci.yml'
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/ptc_bale_ci
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: http://localhost
      SEED_DEMO_PASSWORD: CI-Only-Strong-Password-2026!
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.16.0, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ptc-bale/platform-api lint
      - run: pnpm --filter @ptc-bale/platform-api typecheck
      - run: pnpm --filter @ptc-bale/platform-api test
      - run: pnpm --filter @ptc-bale/platform-api build
      - run: pnpm --filter @ptc-bale/platform-api seed:reset
      - run: pnpm --filter @ptc-bale/platform-api seed:status
      - name: Scan production output
        shell: bash
        run: |
          test -d apps/platform-api/dist
          ! grep -R -E '(BEGIN (RSA|OPENSSH) PRIVATE KEY|mongodb\+srv://|rtsp://[^ ]+:[^ ]+@|CI-Only-Strong-Password)' apps/platform-api/dist

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker network create ptc-api-smoke
      - run: docker run --detach --name mongo-smoke --network ptc-api-smoke mongo:8.0 mongod --bind_ip_all --quiet
      - run: docker build --file apps/platform-api/Dockerfile --tag ptc-platform-api:${{ github.sha }} .
      - run: docker run --detach --name api-smoke --network ptc-api-smoke --publish 4000:4000 --env NODE_ENV=production --env MONGODB_URI=mongodb://mongo-smoke:27017/ptc_smoke --env COOKIE_SECURE=false --env ALLOWED_ORIGINS=http://localhost ptc-platform-api:${{ github.sha }}
      - name: Wait for readiness
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs api-smoke
          exit 1
      - run: curl --fail --silent http://127.0.0.1:4000/healthz | grep -q '"status":"ok"'
      - if: always()
        run: docker rm --force api-smoke mongo-smoke || true

  e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [quality, container]
    env:
      E2E_PASSWORD: CI-Live-API-Password-2026!
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.16.0, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Configure isolated live stack
        shell: bash
        run: |
          cat > infrastructure/local/.env <<'EOF'
          DASHBOARD_PORT=8080
          API_BUILD_VERSION=ci-live
          DASHBOARD_BUILD_VERSION=ci-live
          ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
          SEED_VIEWER_PASSWORD=CI-Live-API-Password-2026!
          SEED_SUPERVISOR_PASSWORD=CI-Live-API-Password-2026!
          SEED_ADMIN_PASSWORD=CI-Live-API-Password-2026!
          EOF
      - name: Start dashboard, API and MongoDB
        run: docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml up --build --detach
      - name: Wait for same-origin readiness
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml ps
          docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml logs
          exit 1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/dashboard-web
      - run: pnpm test:e2e
        working-directory: apps/dashboard-web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-api-playwright-report-${{ github.sha }}
          path: apps/dashboard-web/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml down --volumes
