name: Backend Recovery CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/platform-api/**'
      - 'apps/dashboard-web/**'
      - 'infrastructure/local/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/backend-recovery-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_URL: http://127.0.0.1:8080
      POSTGRES_DB: ptc_bale
      POSTGRES_USER: ptc_app
      POSTGRES_PASSWORD: Recovery-Postgres-Password-2026!
      SUPERVISOR_PASSWORD: Recovery-Supervisor-Password-2026!
      VIEWER_PASSWORD: Recovery-Viewer-Password-2026!
      EVENT_ID: EVT-2407-0253
      MARKER: Recovery validation ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure isolated recovery stack
        shell: bash
        run: |
          : > recovery-validation.log
          cat > infrastructure/local/.env <<'EOF'
          DASHBOARD_PORT=8080
          API_BUILD_VERSION=recovery-postgres
          DASHBOARD_BUILD_VERSION=recovery-postgres
          ALLOWED_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
          POSTGRES_DB=ptc_bale
          POSTGRES_USER=ptc_app
          POSTGRES_PASSWORD=Recovery-Postgres-Password-2026!
          SEED_VIEWER_PASSWORD=Recovery-Viewer-Password-2026!
          SEED_SUPERVISOR_PASSWORD=Recovery-Supervisor-Password-2026!
          SEED_ADMIN_PASSWORD=Recovery-Admin-Password-2026!
          EOF
      - name: Start dashboard, API, migrations, seed and PostgreSQL
        shell: bash
        run: docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml up --build --detach
      - name: Wait for live-stack readiness
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent "$BASE_URL/api/readyz" >/dev/null; then
              echo 'live_stack_ready=true' >> recovery-validation.log
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml ps
          docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml logs
          exit 1
      - name: Create viewer and supervisor sessions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --cookie-jar /tmp/supervisor.cookies \
            --header 'Origin: http://127.0.0.1:8080' \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"supervisor\",\"password\":\"$SUPERVISOR_PASSWORD\"}" \
            "$BASE_URL/api/auth/login" >/tmp/supervisor-login.json
          jq -e '.user.role == "supervisor"' /tmp/supervisor-login.json >/dev/null
          curl --fail --silent --show-error \
            --cookie-jar /tmp/viewer.cookies \
            --header 'Origin: http://127.0.0.1:8080' \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"viewer\",\"password\":\"$VIEWER_PASSWORD\"}" \
            "$BASE_URL/api/auth/login" >/tmp/viewer-login.json
          jq -e '.user.role == "viewer"' /tmp/viewer-login.json >/dev/null
          echo 'sessions_created=true' >> recovery-validation.log
      - name: Load deterministic event version
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/events/$EVENT_ID" >/tmp/event-before.json
          EVENT_VERSION=$(jq -er '.version' /tmp/event-before.json)
          echo "EVENT_VERSION=$EVENT_VERSION" >> "$GITHUB_ENV"
          echo "initial_event_version=$EVENT_VERSION" >> recovery-validation.log
      - name: Confirm viewer cannot review events
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -nc --arg remarks "$MARKER" --argjson version "$EVENT_VERSION" \
            '{reviewStatus:"confirmed",remarks:$remarks,expectedVersion:$version}')
          STATUS=$(curl --silent --show-error --output /tmp/viewer-review.json --write-out '%{http_code}' \
            --cookie /tmp/viewer.cookies \
            --header 'Origin: http://127.0.0.1:8080' \
            --header 'Content-Type: application/json' \
            --request PATCH --data "$BODY" \
            "$BASE_URL/api/events/$EVENT_ID/review")
          test "$STATUS" = '403'
          jq -e '.code == "FORBIDDEN"' /tmp/viewer-review.json >/dev/null
          echo "viewer_review_status=$STATUS" >> recovery-validation.log
      - name: Persist a supervisor review transaction
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -nc --arg remarks "$MARKER" --argjson version "$EVENT_VERSION" \
            '{reviewStatus:"confirmed",remarks:$remarks,expectedVersion:$version}')
          STATUS=$(curl --silent --show-error --output /tmp/review.json --write-out '%{http_code}' \
            --cookie /tmp/supervisor.cookies \
            --header 'Origin: http://127.0.0.1:8080' \
            --header 'Content-Type: application/json' \
            --request PATCH --data "$BODY" \
            "$BASE_URL/api/events/$EVENT_ID/review")
          test "$STATUS" = '200'
          jq -e --arg marker "$MARKER" '.remarks == $marker and .reviewStatus == "confirmed"' /tmp/review.json >/dev/null
          UPDATED_VERSION=$(jq -er '.version' /tmp/review.json)
          test "$UPDATED_VERSION" -eq "$((EVENT_VERSION + 1))"
          echo "UPDATED_VERSION=$UPDATED_VERSION" >> "$GITHUB_ENV"
          echo "successful_review_status=$STATUS" >> recovery-validation.log
          echo "review_version=$UPDATED_VERSION" >> recovery-validation.log
      - name: Reject a stale concurrent review
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -nc --arg remarks "$MARKER" --argjson version "$EVENT_VERSION" \
            '{reviewStatus:"confirmed",remarks:$remarks,expectedVersion:$version}')
          STATUS=$(curl --silent --show-error --output /tmp/stale-review.json --write-out '%{http_code}' \
            --cookie /tmp/supervisor.cookies \
            --header 'Origin: http://127.0.0.1:8080' \
            --header 'Content-Type: application/json' \
            --request PATCH --data "$BODY" \
            "$BASE_URL/api/events/$EVENT_ID/review")
          test "$STATUS" = '409'
          jq -e '.code == "VERSION_CONFLICT"' /tmp/stale-review.json >/dev/null
          echo "stale_review_status=$STATUS" >> recovery-validation.log
      - name: Verify transactional audit record
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml "$@"; }
          AUDIT_COUNT=$(compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At \
            -c "SELECT count(*) FROM audit_logs WHERE \"targetId\" = '$EVENT_ID' AND action = 'event.review.updated';" | tr -d '[:space:]')
          echo "audit_count_observed=$AUDIT_COUNT" >> recovery-validation.log
          test "$AUDIT_COUNT" = '1'
          echo 'transactional_audit_verified=true' >> recovery-validation.log
      - name: Verify normal reseed preserves human review
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml "$@"; }
          compose run --rm --no-deps seed >/tmp/reseed.log
          # Seeding intentionally rotates fixed-user password hashes and revokes
          # existing synthetic sessions, so establish a fresh supervisor session.
          curl --fail --silent --show-error \
            --cookie-jar /tmp/supervisor.cookies \
            --header 'Origin: http://127.0.0.1:8080' \
            --header 'Content-Type: application/json' \
            --data "{\"username\":\"supervisor\",\"password\":\"$SUPERVISOR_PASSWORD\"}" \
            "$BASE_URL/api/auth/login" >/tmp/supervisor-relogin.json
          jq -e '.user.role == "supervisor"' /tmp/supervisor-relogin.json >/dev/null
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/events/$EVENT_ID" >/tmp/event-after-reseed.json
          jq -e --arg marker "$MARKER" --argjson version "$UPDATED_VERSION" \
            '.remarks == $marker and .version == $version' /tmp/event-after-reseed.json >/dev/null
          echo 'normal_reseed_preserved_review=true' >> recovery-validation.log
          echo 'normal_reseed_rotated_sessions=true' >> recovery-validation.log
      - name: Validate API and PostgreSQL restart persistence
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml "$@"; }
          compose restart api
          for attempt in {1..45}; do
            if curl --fail --silent "$BASE_URL/api/readyz" >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/events/$EVENT_ID" >/tmp/event-after-api-restart.json
          jq -e --arg marker "$MARKER" '.remarks == $marker' /tmp/event-after-api-restart.json >/dev/null
          compose restart postgres
          for attempt in {1..45}; do
            if compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          compose restart api
          for attempt in {1..45}; do
            if curl --fail --silent "$BASE_URL/api/readyz" >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            "$BASE_URL/api/events/$EVENT_ID" >/tmp/event-after-postgres-restart.json
          jq -e --arg marker "$MARKER" '.remarks == $marker' /tmp/event-after-postgres-restart.json >/dev/null
          echo 'api_restart_preserved_review=true' >> recovery-validation.log
          echo 'postgres_restart_preserved_review=true' >> recovery-validation.log
      - name: Reconcile filtered CSV with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml "$@"; }
          curl --fail --silent --show-error --cookie /tmp/supervisor.cookies \
            --header 'Origin: http://127.0.0.1:8080' --header 'Content-Type: application/json' \
            --data '{"format":"csv","outcome":"missed"}' "$BASE_URL/api/exports/events" >/tmp/missed-events.csv
          CSV_ROWS=$(tail -n +2 /tmp/missed-events.csv | tr -d '\r' | grep -c . || true)
          DB_ROWS=$(compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At \
            -c "SELECT count(*) FROM inspection_events WHERE outcome = 'missed';" | tr -d '[:space:]')
          test "$CSV_ROWS" -eq "$DB_ROWS"
          echo "missed_csv_rows=$CSV_ROWS" >> recovery-validation.log
          echo "missed_database_rows=$DB_ROWS" >> recovery-validation.log
          echo 'filtered_csv_reconciled=true' >> recovery-validation.log
      - name: Validate pg_dump and pg_restore recovery
        shell: bash
        run: |
          set -euo pipefail
          compose() { docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml "$@"; }
          compose exec -T postgres pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc >/tmp/ptc-bale-recovery.dump
          test -s /tmp/ptc-bale-recovery.dump
          compose exec -T postgres dropdb --if-exists -U "$POSTGRES_USER" ptc_bale_restore
          compose exec -T postgres createdb -U "$POSTGRES_USER" ptc_bale_restore
          cat /tmp/ptc-bale-recovery.dump | compose exec -T postgres \
            pg_restore -U "$POSTGRES_USER" -d ptc_bale_restore --no-owner --no-privileges
          SOURCE_EVENTS=$(compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At \
            -c 'SELECT count(*) FROM inspection_events;' | tr -d '[:space:]')
          RESTORED_EVENTS=$(compose exec -T postgres psql -U "$POSTGRES_USER" -d ptc_bale_restore -At \
            -c 'SELECT count(*) FROM inspection_events;' | tr -d '[:space:]')
          test "$SOURCE_EVENTS" = '257'
          test "$RESTORED_EVENTS" = "$SOURCE_EVENTS"
          RESTORED_REMARKS=$(compose exec -T postgres psql -U "$POSTGRES_USER" -d ptc_bale_restore -At \
            -c "SELECT remarks FROM inspection_events WHERE id = '$EVENT_ID';")
          test "$RESTORED_REMARKS" = "$MARKER"
          RESTORED_AUDITS=$(compose exec -T postgres psql -U "$POSTGRES_USER" -d ptc_bale_restore -At \
            -c "SELECT count(*) FROM audit_logs WHERE \"targetId\" = '$EVENT_ID';" | tr -d '[:space:]')
          test "$RESTORED_AUDITS" = '1'
          echo "source_event_count=$SOURCE_EVENTS" >> recovery-validation.log
          echo "restored_event_count=$RESTORED_EVENTS" >> recovery-validation.log
          echo "restored_audit_count=$RESTORED_AUDITS" >> recovery-validation.log
          echo 'pg_dump_restore_reconciled=true' >> recovery-validation.log
      - name: Upload sanitized recovery record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-recovery-validation-${{ github.sha }}
          path: recovery-validation.log
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup
        if: always()
        shell: bash
        run: docker compose --env-file infrastructure/local/.env --file infrastructure/local/docker-compose.api.yml down --volumes >/dev/null 2>&1 || true
