name: Backup Recovery Certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/platform-api/**'
      - 'infrastructure/**'
      - 'scripts/security/certify-backup-recovery.sh'
      - '.github/workflows/backup-recovery-certification.yml'
      - 'docs/49-recovery-rebuild-security-closure.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'apps/platform-api/**'
      - 'infrastructure/**'
      - 'scripts/security/certify-backup-recovery.sh'
      - '.github/workflows/backup-recovery-certification.yml'
      - 'docs/49-recovery-rebuild-security-closure.md'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: backup-recovery-cert-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate recovery harness syntax
        run: bash -n scripts/security/certify-backup-recovery.sh

      - name: Certify non-destructive backup and recovery
        run: bash scripts/security/certify-backup-recovery.sh

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-recovery-cert-${{ github.sha }}
          path: .certification/backup-recovery/
          if-no-files-found: warn
          retention-days: 14
