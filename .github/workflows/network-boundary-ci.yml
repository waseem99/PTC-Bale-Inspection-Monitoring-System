name: Network Boundary CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/src/**'
      - 'infrastructure/local/**'
      - 'infrastructure/aws/**'
      - 'scripts/security/**'
      - 'tools/edge-simulator/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/network-boundary-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/src/**'
      - 'infrastructure/local/**'
      - 'infrastructure/aws/**'
      - 'scripts/security/**'
      - 'tools/edge-simulator/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/network-boundary-ci.yml'

permissions:
  contents: read

concurrency:
  group: network-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static service and credential boundaries
        run: node scripts/security/verify-network-boundary.mjs
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Build frontend with hostile legacy secret canaries
        run: pnpm --filter @ptc-bale/dashboard-web build
        env:
          VITE_DATA_MODE: live
          VITE_API_BASE_URL: /api
          VITE_ALLOW_DEMO_CREDENTIALS: 'false'
          VITE_CAMERA_PREVIEW_MODE: drive
          VITE_CAMERA_01_PREVIEW_URL: 'rtsp://PTC-BUNDLE-CANARY-USER:PTC-BUNDLE-CANARY-PASSWORD@10.10.10.10/stream'
          VITE_CAMERA_02_PREVIEW_URL: 'https://PTC-BUNDLE-CANARY-USER:PTC-BUNDLE-CANARY-PASSWORD@camera.invalid/preview'
          DATABASE_URL: 'postgresql://PTC-BUNDLE-CANARY-DB:PTC-BUNDLE-CANARY-DB-PASSWORD@db.invalid:5432/ptc'
      - name: Reject browser bundle secret leakage
        shell: bash
        run: |
          test -d apps/dashboard-web/dist
          grep -R -n -E '(PTC-BUNDLE-CANARY|BEGIN (RSA|OPENSSH) PRIVATE KEY|postgresql://[^ ]+:[^ ]+@|rtsps?://[^ ]+:[^ ]+@)' apps/dashboard-web/dist > network-boundary-bundle-scan.log || true
          if test -s network-boundary-bundle-scan.log; then
            cat network-boundary-bundle-scan.log
            exit 1
          fi
      - name: Run focused camera preview regression tests
        run: pnpm --filter @ptc-bale/dashboard-web test -- cameraPreview.test.tsx
      - name: Upload boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-boundary-${{ github.sha }}
          path: network-boundary-bundle-scan.log
          if-no-files-found: ignore
          retention-days: 14
