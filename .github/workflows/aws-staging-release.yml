name: AWS Staging Release

on:
  pull_request:
    paths:
      - '.github/workflows/aws-staging-release.yml'
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/**'
      - 'infrastructure/aws/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-staging-release.yml'
      - 'apps/dashboard-web/**'
      - 'apps/platform-api/**'
      - 'infrastructure/aws/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ptc-bale-aws-staging-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-package:
    name: Validate and package AWS release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_name: ${{ steps.bundle.outputs.release_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Generate isolated CI credentials
        shell: bash
        run: |
          set -euo pipefail
          DB_PASSWORD="$(openssl rand -hex 24)"
          SEED_PASSWORD="$(openssl rand -hex 24)"
          INGESTION_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${DB_PASSWORD}"
          echo "::add-mask::${SEED_PASSWORD}"
          echo "::add-mask::${INGESTION_TOKEN}"
          {
            echo "CI_DB_PASSWORD=${DB_PASSWORD}"
            echo "DATABASE_URL=postgresql://ptc_ci:${DB_PASSWORD}@127.0.0.1:55432/ptc_bale_ci?schema=public"
            echo "SEED_DEMO_PASSWORD=${SEED_PASSWORD}"
            echo "INGESTION_SERVICE_TOKEN=${INGESTION_TOKEN}"
            echo "NODE_ENV=test"
            echo "COOKIE_SECURE=false"
            echo "TRUST_PROXY=false"
            echo "ALLOWED_ORIGINS=http://localhost:4173"
            echo "SIMULATOR_ENABLED=true"
          } >> "$GITHUB_ENV"

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ptc-aws-release-postgres \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_DB=ptc_bale_ci \
            --env POSTGRES_USER=ptc_ci \
            --env POSTGRES_PASSWORD="$CI_DB_PASSWORD" \
            postgres:17-alpine
          for attempt in {1..60}; do
            if docker exec ptc-aws-release-postgres pg_isready -U ptc_ci -d ptc_bale_ci >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs ptc-aws-release-postgres
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application and database
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @ptc-bale/platform-api db:generate
          pnpm --filter @ptc-bale/platform-api db:migrate:deploy
          pnpm --filter @ptc-bale/platform-api check
          pnpm --filter @ptc-bale/dashboard-web check
          node --check 'apps/dashboard-web/api/[...path].mjs'
          node -e "JSON.parse(require('fs').readFileSync('apps/dashboard-web/vercel.json', 'utf8'))"

      - name: Validate scripts and Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          bash -n infrastructure/aws/scripts/*.sh
          TEMP_ENV="$(mktemp)"
          cat > "$TEMP_ENV" <<EOF
          API_DOMAIN=api.ptc-aibale.codistan.org
          APP_DOMAIN=aws.ptc-aibale.codistan.org
          TLS_EMAIL=ci@example.invalid
          POSTGRES_DB=ptc_bale
          POSTGRES_USER=ptc_app
          POSTGRES_PASSWORD=${CI_DB_PASSWORD}
          DATABASE_URL=postgresql://ptc_app:${CI_DB_PASSWORD}@postgres:5432/ptc_bale?schema=public
          NODE_ENV=production
          PORT=4000
          SESSION_COOKIE_NAME=ptc_session
          SESSION_TTL_HOURS=8
          COOKIE_SECURE=true
          TRUST_PROXY=true
          ALLOWED_ORIGINS=https://ptc-aibale.codistan.org,https://aws.ptc-aibale.codistan.org
          INGESTION_SERVICE_TOKEN=${INGESTION_SERVICE_TOKEN}
          EVIDENCE_ROOT=/var/lib/ptc-bale/evidence
          MAX_EVIDENCE_BYTES=26214400
          BUILD_VERSION=${GITHUB_SHA}
          BUILD_COMMIT=${GITHUB_SHA}
          SCHEMA_VERSION=20260731-production-readiness
          SIMULATOR_ENABLED=false
          SEED_VIEWER_PASSWORD=${SEED_DEMO_PASSWORD}
          SEED_SUPERVISOR_PASSWORD=${SEED_DEMO_PASSWORD}
          SEED_ADMIN_PASSWORD=${SEED_DEMO_PASSWORD}
          SEED_ON_FIRST_DEPLOY=true
          BACKUP_RETENTION_DAYS=14
          IMAGE_TAG=${GITHUB_SHA}
          ARTIFACT_BUCKET=ci-placeholder
          AWS_REGION=us-east-1
          RUNTIME_PARAMETER_NAME=/ptc-bale/staging/runtime-env-b64
          EOF
          docker compose --env-file "$TEMP_ENV" -f infrastructure/aws/docker-compose.staging.yml config --quiet
          rm -f "$TEMP_ENV"

      - name: Build immutable runtime images
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --file apps/platform-api/Dockerfile.aws \
            --target runtime \
            --tag "ptc-bale-api:${GITHUB_SHA}" .
          docker build --platform linux/amd64 \
            --file apps/platform-api/Dockerfile.aws \
            --target tools \
            --tag "ptc-bale-tools:${GITHUB_SHA}" .
          docker build --platform linux/amd64 \
            --file apps/dashboard-web/Dockerfile.aws \
            --build-arg VITE_BUILD_VERSION="${GITHUB_SHA}" \
            --target runtime \
            --tag "ptc-bale-dashboard:${GITHUB_SHA}" .

      - name: Smoke-test runtime images
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect \
            "ptc-bale-api:${GITHUB_SHA}" \
            "ptc-bale-tools:${GITHUB_SHA}" \
            "ptc-bale-dashboard:${GITHUB_SHA}" >/dev/null
          test "$(docker image inspect --format '{{.Config.User}}' "ptc-bale-api:${GITHUB_SHA}")" = app

      - name: Create checksummed release bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NAME="ptc-bale-${GITHUB_SHA}"
          mkdir -p release/scripts
          cp infrastructure/aws/docker-compose.staging.yml release/
          cp infrastructure/aws/Caddyfile release/
          cp infrastructure/aws/scripts/deploy-release.sh release/scripts/
          cp infrastructure/aws/scripts/backup-postgres.sh release/scripts/
          cp infrastructure/aws/scripts/restore-postgres.sh release/scripts/
          printf '%s\n' "$GITHUB_SHA" > release/VERSION
          docker save \
            "ptc-bale-api:${GITHUB_SHA}" \
            "ptc-bale-tools:${GITHUB_SHA}" \
            "ptc-bale-dashboard:${GITHUB_SHA}" \
            | gzip -9 > release/images.tar.gz
          tar -C release -czf "${RELEASE_NAME}.tar.gz" .
          sha256sum "${RELEASE_NAME}.tar.gz" > "${RELEASE_NAME}.tar.gz.sha256"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload validated release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.release_name }}
          path: |
            ${{ steps.bundle.outputs.release_name }}.tar.gz
            ${{ steps.bundle.outputs.release_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Stop isolated PostgreSQL
        if: always()
        run: docker rm --force ptc-aws-release-postgres >/dev/null 2>&1 || true

  deploy:
    name: Deploy AWS staging
    if: github.event_name != 'pull_request'
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: aws-staging
      url: https://ptc-aibale.codistan.org
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate protected deployment variables
        shell: bash
        env:
          AWS_REGION_VALUE: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN_VALUE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_ARTIFACT_BUCKET_VALUE: ${{ vars.AWS_ARTIFACT_BUCKET }}
          AWS_EC2_INSTANCE_ID_VALUE: ${{ vars.AWS_EC2_INSTANCE_ID }}
          AWS_RUNTIME_PARAMETER_NAME_VALUE: ${{ vars.AWS_RUNTIME_PARAMETER_NAME }}
          AWS_API_DOMAIN_VALUE: ${{ vars.AWS_API_DOMAIN }}
        run: |
          set -euo pipefail
          for name in \
            AWS_REGION_VALUE \
            AWS_DEPLOY_ROLE_ARN_VALUE \
            AWS_ARTIFACT_BUCKET_VALUE \
            AWS_EC2_INSTANCE_ID_VALUE \
            AWS_RUNTIME_PARAMETER_NAME_VALUE \
            AWS_API_DOMAIN_VALUE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing protected GitHub Environment variable: ${name%_VALUE}" >&2
              exit 1
            fi
          done
          [[ "$AWS_API_DOMAIN_VALUE" == api.ptc-aibale.codistan.org ]]

      - name: Download validated release
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.validate-and-package.outputs.release_name }}

      - name: Verify release checksum
        run: sha256sum --check '${{ needs.validate-and-package.outputs.release_name }}.tar.gz.sha256'

      - name: Configure temporary AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: ptc-bale-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://infrastructure/aws/cloudformation/staging-stack.yml >/dev/null

      - name: Upload immutable release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_NAME='${{ needs.validate-and-package.outputs.release_name }}'
          PREFIX="s3://${{ vars.AWS_ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}"
          sha256sum "${RELEASE_NAME}.tar.gz" \
            | sed "s|${RELEASE_NAME}.tar.gz|release.tar.gz|" \
            > /tmp/release.tar.gz.sha256
          aws s3 cp "${RELEASE_NAME}.tar.gz" "${PREFIX}/release.tar.gz" --only-show-errors
          aws s3 cp /tmp/release.tar.gz.sha256 "${PREFIX}/release.tar.gz.sha256" --only-show-errors

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="/opt/ptc-bale/releases/${GITHUB_SHA}"
          S3_PREFIX="s3://${{ vars.AWS_ARTIFACT_BUCKET }}/releases/${GITHUB_SHA}"
          jq -n \
            --arg release_dir "$RELEASE_DIR" \
            --arg s3_prefix "$S3_PREFIX" \
            --arg sha "$GITHUB_SHA" \
            --arg bucket "${{ vars.AWS_ARTIFACT_BUCKET }}" \
            --arg region "${{ vars.AWS_REGION }}" \
            --arg parameter "${{ vars.AWS_RUNTIME_PARAMETER_NAME }}" \
            '{commands: [
              "set -euo pipefail",
              ("rm -rf " + $release_dir + " && mkdir -p " + $release_dir),
              ("aws s3 cp " + $s3_prefix + "/release.tar.gz /tmp/release.tar.gz --only-show-errors"),
              ("aws s3 cp " + $s3_prefix + "/release.tar.gz.sha256 /tmp/release.tar.gz.sha256 --only-show-errors"),
              "cd /tmp && sha256sum --check release.tar.gz.sha256",
              ("tar -xzf /tmp/release.tar.gz -C " + $release_dir),
              ("chmod 0755 " + $release_dir + "/scripts/*.sh"),
              ("bash " + $release_dir + "/scripts/deploy-release.sh " + $sha + " " + $bucket + " " + $region + " " + $parameter),
              "rm -f /tmp/release.tar.gz /tmp/release.tar.gz.sha256"
            ]}' > /tmp/ptc-ssm-parameters.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids '${{ vars.AWS_EC2_INSTANCE_ID }}' \
            --document-name AWS-RunShellScript \
            --comment "Deploy PTC Bale ${GITHUB_SHA}" \
            --timeout-seconds 2400 \
            --parameters file:///tmp/ptc-ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          STATUS=Pending
          for attempt in {1..240}; do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id '${{ vars.AWS_EC2_INSTANCE_ID }}' \
              --query Status \
              --output text 2>/dev/null || printf Pending)"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id '${{ vars.AWS_EC2_INSTANCE_ID }}' \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' || true
          [[ "$STATUS" == Success ]]

      - name: Verify public API readiness
        run: |
          curl --fail --show-error --silent \
            --retry 20 --retry-delay 5 --retry-all-errors \
            'https://${{ vars.AWS_API_DOMAIN }}/readyz'
