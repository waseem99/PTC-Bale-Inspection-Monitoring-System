name: Bug
description: Report a reproducible defect in the approved solution
title: "[BUG] "
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - security, data loss, or complete outage
        - P1 - core workflow unavailable or materially incorrect
        - P2 - non-blocking defect with workaround
        - P3 - cosmetic or documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and versions
      description: Local/edge/API/dashboard/model/rule/configuration versions and camera ID where relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Operational impact
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence reference
      description: Reference the approved restricted storage location and event ID. Do not upload client footage, raw evidence, credentials, or site-sensitive files to GitHub, even though the repository is private.
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: The issue contains no credentials, production IPs, client footage, raw evidence files, personal data, or restricted client documents.
          required: true