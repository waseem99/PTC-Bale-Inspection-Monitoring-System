name: Technical spike
description: Time-box an unresolved technical decision that blocks approved delivery
title: "[SPIKE] "
body:
  - type: textarea
    id: question
    attributes:
      label: Decision question
      description: State the specific uncertainty this spike must resolve.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and blocking impact
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options to evaluate
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Time-box
      placeholder: e.g. 1 working day
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Required output
      description: Benchmark, decision record, recommendation, prototype, or risk assessment.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Completion criteria
      value: |
        - [ ] Evidence gathered
        - [ ] Options compared
        - [ ] Decision recorded in docs/15-decision-log.md
        - [ ] Follow-up implementation issues updated
    validations:
      required: true
