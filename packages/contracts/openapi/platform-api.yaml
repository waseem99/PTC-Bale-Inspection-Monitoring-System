openapi: 3.1.0
info:
  title: PTC Bale Inspection Platform API
  version: 1.2.0
  description: >-
    Local-first PoC workflow API for the approved dashboard, PostgreSQL platform,
    edge delivery, protected evidence, reporting and operational diagnostics.
    Simulator records are never client acceptance evidence.
servers:
  - url: /api
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: currentSession
      responses:
        '200': { description: Active session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Session revoked }
  /dashboard/summary:
    get:
      operationId: dashboardSummary
      responses:
        '200': { description: Dashboard KPI summary, content: { application/json: { schema: { $ref: '#/components/schemas/KpiSummary' } } } }
  /cameras:
    get:
      operationId: listCameras
      responses:
        '200':
          description: Camera status list
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Camera' } }
  /health:
    get:
      operationId: systemHealth
      responses:
        '200':
          description: System health metrics
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HealthMetric' } }
  /events:
    get:
      operationId: listEvents
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, enum: [10, 20, 50, 100], default: 20 } }
        - { name: cameraId, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/Outcome' } }
        - { name: reviewStatus, in: query, schema: { $ref: '#/components/schemas/ReviewStatus' } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: sortBy, in: query, schema: { type: string, enum: [timestamp, outcome, confidence, reviewStatus, cameraName], default: timestamp } }
        - { name: sortDirection, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Paginated events, content: { application/json: { schema: { $ref: '#/components/schemas/EventPage' } } } }
  /events/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
    get:
      operationId: getEvent
      responses:
        '200': { description: Inspection event, content: { application/json: { schema: { $ref: '#/components/schemas/InspectionEvent' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /events/{eventId}/review:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
    patch:
      operationId: reviewEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewStatus, remarks, expectedVersion]
              properties:
                reviewStatus: { type: string, enum: [confirmed, dismissed] }
                remarks: { type: string, maxLength: 1000 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated event, content: { application/json: { schema: { $ref: '#/components/schemas/InspectionEvent' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /events/{eventId}/audit:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
    get:
      operationId: eventAudit
      responses:
        '200':
          description: Bounded event audit history
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditRecord' } }
  /events/{eventId}/evidence:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
    get:
      operationId: eventEvidence
      responses:
        '200': { description: Protected evidence metadata, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceMetadata' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /evidence/{evidenceId}/content:
    parameters:
      - { name: evidenceId, in: path, required: true, schema: { type: string, maxLength: 96 } }
      - { name: Range, in: header, required: false, schema: { type: string, examples: [bytes=0-1023] } }
    get:
      operationId: evidenceContent
      responses:
        '200': { description: Complete authorized evidence content }
        '206': { description: Authorized byte range for clip playback }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '416': { $ref: '#/components/responses/Error' }
  /exports/events:
    post:
      operationId: exportEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportFilter' }
      responses:
        '200': { description: Bounded filtered CSV without evidence media, content: { text/csv: { schema: { type: string } } } }
  /reports/summary:
    get:
      operationId: reportSummary
      parameters: { $ref: '#/components/x-report-parameters' }
      responses:
        '200': { description: Report totals from PostgreSQL filters }
  /reports/pdf:
    get:
      operationId: reportPdf
      parameters:
        - { name: cameraId, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/Outcome' } }
        - { name: reviewStatus, in: query, schema: { $ref: '#/components/schemas/ReviewStatus' } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Generated PDF summary, content: { application/pdf: { schema: { type: string, format: binary } } } }
  /realtime:
    get:
      operationId: realtimeUpdates
      responses:
        '200': { description: Authenticated SSE stream for event, health and evidence updates, content: { text/event-stream: { schema: { type: string } } } }
  /system/release:
    get:
      operationId: releaseIdentity
      responses:
        '200': { description: Service, commit, schema and data identity }
  /catalog/reason-codes:
    get:
      operationId: reasonCodeCatalog
      responses:
        '200': { description: Versioned outcome/reason-code catalog }
  /ingest/events:
    post:
      security: [{ serviceBearer: [] }]
      operationId: ingestEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestEvent' }
      responses:
        '202': { description: New event accepted }
        '200': { description: Exact replay acknowledged as duplicate }
        '409': { description: Event ID exists with a different payload, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { $ref: '#/components/responses/Error' }
  /ingest/health:
    post:
      security: [{ serviceBearer: [] }]
      operationId: ingestHealth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestHealth' }
      responses:
        '202': { description: Health metric accepted }
        '200': { description: Existing or stale sequence handled }
  /ingest/evidence/{eventId}:
    parameters:
      - { $ref: '#/components/parameters/EventId' }
      - { name: X-Evidence-ID, in: header, required: true, schema: { type: string, maxLength: 96 } }
      - { name: X-Checksum-SHA256, in: header, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' } }
      - { name: X-Duration-MS, in: header, required: false, schema: { type: integer, minimum: 0, maximum: 600000 } }
    post:
      security: [{ serviceBearer: [] }]
      operationId: uploadEvidence
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          video/mp4: { schema: { type: string, format: binary } }
      responses:
        '201': { description: Atomically stored and finalized }
        '200': { description: Exact evidence replay acknowledged }
        '409': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /operations/evidence/status:
    get:
      operationId: evidenceStatus
      responses:
        '200': { description: Evidence lifecycle counts }
  /operations/evidence/consistency:
    get:
      operationId: evidenceConsistency
      responses:
        '200': { description: Missing, unsafe and orphan evidence report with disk summary }
  /operations/evidence/reconcile:
    post:
      operationId: reconcileEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [report, mark-missing, quarantine-orphans], default: report }
                dryRun: { type: boolean, default: true }
      responses:
        '200': { description: Dry-run or audited reconciliation result }
        '403': { $ref: '#/components/responses/Error' }
  /operations/evidence/retention:
    post:
      operationId: evidenceRetention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [olderThanDays]
              properties:
                olderThanDays: { type: integer, minimum: 1, maximum: 3650 }
                dryRun: { type: boolean, default: true }
      responses:
        '200': { description: Dry-run or audited deletion result; pending/quarantined evidence is protected }
        '403': { $ref: '#/components/responses/Error' }
  /operations/diagnostics:
    get:
      operationId: operationalDiagnostics
      responses:
        '200': { description: Safe evidence, backup, warning and retention diagnostics }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: ptc_session }
    serviceBearer: { type: http, scheme: bearer, bearerFormat: opaque-service-token }
  parameters:
    EventId: { name: eventId, in: path, required: true, schema: { type: string, maxLength: 64 } }
  x-report-parameters:
    - { name: cameraId, in: query, schema: { type: string } }
    - { name: outcome, in: query, schema: { $ref: '#/components/schemas/Outcome' } }
    - { name: reviewStatus, in: query, schema: { $ref: '#/components/schemas/ReviewStatus' } }
    - { name: from, in: query, schema: { type: string, format: date } }
    - { name: to, in: query, schema: { type: string, format: date } }
  responses:
    Error:
      description: Stable API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    Role: { type: string, enum: [viewer, supervisor, admin] }
    Outcome: { type: string, enum: [completed, missed, incomplete, unresolved] }
    ReviewStatus: { type: string, enum: [unreviewed, confirmed, dismissed] }
    User:
      type: object
      required: [id, username, displayName, role]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    Session:
      type: object
      required: [token, user, expiresAt]
      properties:
        token: { type: string, description: Empty for cookie-backed sessions }
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: string, format: date-time }
    EventStep:
      type: object
      required: [label, state]
      properties:
        label: { type: string }
        state: { type: string, enum: [complete, failed, unknown] }
        time: { type: string }
    InspectionEvent:
      type: object
      required: [id, cameraId, cameraName, zone, timestamp, outcome, reason, confidence, reviewStatus, summary, evidenceAvailable, modelVersion, ruleVersion, version, steps]
      properties:
        id: { type: string }
        cameraId: { type: string }
        cameraName: { type: string }
        zone: { type: string }
        timestamp: { type: string, format: date-time }
        outcome: { $ref: '#/components/schemas/Outcome' }
        reason: { type: string }
        confidence: { type: integer, minimum: 0, maximum: 100 }
        reviewStatus: { $ref: '#/components/schemas/ReviewStatus' }
        summary: { type: string }
        evidenceAvailable: { type: boolean }
        remarks: { type: string }
        reviewedBy: { type: string }
        reviewedAt: { type: string, format: date-time }
        modelVersion: { type: string }
        ruleVersion: { type: string }
        version: { type: integer, minimum: 1 }
        steps: { type: array, items: { $ref: '#/components/schemas/EventStep' } }
    EventPage:
      type: object
      required: [items, page, pageSize, total, totalPages, hasNextPage, hasPreviousPage, generatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InspectionEvent' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }
        generatedAt: { type: string, format: date-time }
    Camera:
      type: object
      required: [id, name, zone, status, aiStatus, lastFrameAt, fps, streamQuality, todayEvents]
      properties:
        id: { type: string }
        name: { type: string }
        zone: { type: string }
        status: { type: string, enum: [online, warning, offline, reconnecting, disabled, degraded, unknown] }
        aiStatus: { type: string, enum: [processing, degraded, stopped, simulated, unavailable, loading, ready, failed] }
        lastFrameAt: { type: string, format: date-time }
        fps: { type: number }
        streamQuality: { type: string }
        todayEvents: { type: integer }
    HealthMetric:
      type: object
      required: [id, label, value, detail, state, checkedAt]
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: string }
        detail: { type: string }
        state: { type: string, enum: [healthy, warning, critical, neutral] }
        checkedAt: { type: string, format: date-time }
    KpiSummary:
      type: object
      required: [total, completed, violations, unresolved, unreviewed, completedRate, periodLabel, generatedAt]
      properties:
        total: { type: integer }
        completed: { type: integer }
        violations: { type: integer }
        unresolved: { type: integer }
        unreviewed: { type: integer }
        completedRate: { type: number }
        periodLabel: { type: string }
        generatedAt: { type: string, format: date-time }
    EvidenceMetadata:
      type: object
      required: [id, eventId, state, type, source, createdAt, updatedAt]
      properties:
        id: { type: string }
        eventId: { type: string }
        state: { type: string, enum: [available, unavailable, pending, missing, failed, quarantined, deleted] }
        type: { type: string, enum: [snapshot, clip, none] }
        mimeType: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'] }
        durationMs: { type: [integer, 'null'] }
        checksum: { type: [string, 'null'] }
        source: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        contentUrl: { type: [string, 'null'], description: Authorized API URL; never a filesystem path }
    AuditRecord:
      type: object
      required: [id, actionId, actorId, actorDisplayName, actorRole, action, correlationId, occurredAt]
      properties:
        id: { type: string }
        actionId: { type: string }
        actorId: { type: string }
        actorDisplayName: { type: string }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string }
        before: {}
        after: {}
        correlationId: { type: string }
        occurredAt: { type: string, format: date-time }
    ReportFilter:
      type: object
      additionalProperties: false
      properties:
        cameraId: { type: string }
        outcome: { $ref: '#/components/schemas/Outcome' }
        reviewStatus: { $ref: '#/components/schemas/ReviewStatus' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        format: { type: string, const: csv }
    IngestEvent:
      allOf:
        - { $ref: '#/components/schemas/InspectionEvent' }
        - type: object
          required: [configVersion, edgeVersion, schemaVersion, source]
          properties:
            configVersion: { type: string }
            edgeVersion: { type: string }
            schemaVersion: { type: integer, minimum: 1 }
            source: { type: string, enum: [edge, simulator] }
    IngestHealth:
      allOf:
        - { $ref: '#/components/schemas/HealthMetric' }
        - type: object
          required: [source, sequence]
          properties:
            source: { type: string }
            sequence: { type: integer, minimum: 0 }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        status: { type: integer }
        correlationId: { type: string }
        details: { type: object, additionalProperties: true }
